name: Build Native
on: push

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    name: Build - ${{ matrix.platform.os-name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os-name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os-name: win-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            binary-ext: .exe

          - os-name: win-arm64
            runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary-ext: .exe

          - os-name: osx-x64
            runs-on: macOS-latest
            target: x86_64-apple-darwin

          - os-name: osx-arm64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        env:
          EXDVIEWER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        with:
          target: ${{ matrix.platform.target }}
          args: "--locked --release --bin viewer"
          strip: true

      - name: Rename Binary
        shell: bash
        run: |
          mv -f target/${{ matrix.platform.target }}/release/viewer${{ matrix.platform.binary-ext }} xiviewer-${{ matrix.platform.os-name }}${{ matrix.platform.binary-ext }}

      - name: Attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            xiviewer-${{ matrix.platform.os-name }}${{ matrix.platform.binary-ext }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiviewer-${{ matrix.platform.os-name }}
          path: |
            xiviewer-${{ matrix.platform.os-name }}${{ matrix.platform.binary-ext }}

release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'CN-')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Native Artifacts
        uses: actions/download-artifact@v4

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Get Package Version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^CN-', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "标签 $env:GITHUB_REF_NAME 必须使用 CN-主版本.次版本.修订版本.0 格式"
          }
          "version=$($version -replace '\.0$', '')" >> $env:GITHUB_OUTPUT

      - name: Download Previous Velopack Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '[.[] | .assets[]?.name]' | ConvertFrom-Json
          foreach ($channel in 'win', 'win-arm64') {
            if ($assets -contains "releases.$channel.json") {
              vpk download github --repoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN --outputDir Releases --channel $channel
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

      - name: Package Velopack Updates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\win-x64 | Out-Null
          Copy-Item xiviewer-win-x64\xiviewer-win-x64.exe package\win-x64\viewer.exe
          vpk pack -u EXDViewer -v "${{ steps.version.outputs.version }}" -p package\win-x64 -e viewer.exe -r win-x64 -c win -i viewer\assets\icon.ico --packTitle EXDViewer --packAuthors AtmoOmen
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          New-Item -ItemType Directory -Force package\win-arm64 | Out-Null
          Copy-Item xiviewer-win-arm64\xiviewer-win-arm64.exe package\win-arm64\viewer.exe
          vpk pack -u EXDViewer -v "${{ steps.version.outputs.version }}" -p package\win-arm64 -e viewer.exe -r win-arm64 -c win-arm64 -i viewer\assets\icon.ico --packTitle EXDViewer --packAuthors AtmoOmen
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish Velopack Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN --outputDir Releases --channel win --publish --releaseName $env:GITHUB_REF_NAME --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          vpk upload github --repoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN --outputDir Releases --channel win-arm64 --merge --publish --releaseName $env:GITHUB_REF_NAME --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Attach Native Binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME `
            xiviewer-linux-x64\xiviewer-linux-x64 `
            xiviewer-linux-arm64\xiviewer-linux-arm64 `
            xiviewer-win-x64\xiviewer-win-x64.exe `
            xiviewer-win-arm64\xiviewer-win-arm64.exe `
            xiviewer-osx-x64\xiviewer-osx-x64 `
            xiviewer-osx-arm64\xiviewer-osx-arm64
