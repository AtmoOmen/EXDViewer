# These are the defaults. This file doesn't need to exist unless you want to override them.
# You can also set these as environment variables.
# For example, server_addr can be set with the environment variable SERVER_ADDR.

# This is a pretty sensible logging default.
# See https://docs.rs/env_logger/latest/env_logger/#enabling-logging
log_filter: debug,exdviewer_web=debug,tracing::span=warn,foyer_memory::raw=warn,hyper_util::client::legacy=warn,reqwest::connect=warn
# The default is 0.0.0.0:80 to make docker bind to port 80.
server_addr: 0.0.0.0:3000
# Uncomment to enable the metrics server.
# metrics_server_addr: 0.0.0.0:4000
cache:
  max_concurrent_downloads: 4
  storage_directory: cache
  # storage_file points the disk tier at a single file or a raw unformatted block device
  # instead of a directory, skipping the filesystem entirely. Takes precedence over
  # storage_directory if both are set.
  # storage_file: /dev/disk/by-id/scsi-0DEVICE_ID
  # storage_capacity_bytes is set explicitly here because storage_directory usually
  # shares its filesystem with other things; left unset it falls back to 80% of the
  # directory's free space. Left unset for storage_file instead, an existing file or
  # device is filled to its own size, since it is assumed to be dedicated to the cache.
  storage_capacity_bytes: 1073741824 # 1GiB
  clut_ram_bytes: 536870912 # 512 MiB
# How much of a file to download at once. Larger values reduces amortized latency.
file_readahead: 8388608 # 8 MiB
path_list:
  # Presence maps are immutable once built.
  cache_directory: cache/paths
report:
  # forward_url is the live ResLogger, so this alone starts submitting to it. Until then names are
  # collected and logged and nothing leaves the box.
  enabled: false
  # forward_url: https://rl2.perchbird.dev/api/upload
  # max_paths: 250
  # per_hour: 60
